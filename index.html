<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Links - Welcome</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* Classic Windows 95/98 Teal Desktop */
      background-color: #008080;
      font-family: "MS Sans Serif", Tahoma, Verdana, Arial, sans-serif;
      font-size: 14px;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Main Window Container */
    .window {
      width: 100%;
      max-width: 440px;
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset -1px -1px #808080, inset 1px 1px #dfdfdf;
      padding: 3px;
    }

    /* Classic Blue Title Bar */
    .title-bar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: #ffffff;
      font-weight: bold;
      padding: 4px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.3px;
      user-select: none;
    }

    .title-bar-controls {
      display: flex;
      gap: 2px;
    }

    .title-btn {
      width: 18px;
      height: 16px;
      background-color: #c0c0c0;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #000000;
      border-bottom: 1px solid #000000;
      box-shadow: inset -1px -1px #808080;
      font-size: 11px;
      font-weight: bold;
      line-height: 12px;
      text-align: center;
      color: #000000;
    }

    /* Decorative Menu Bar */
    .menu-bar {
      display: flex;
      gap: 14px;
      padding: 4px 8px;
      font-size: 13px;
      border-bottom: 1px solid #808080;
      box-shadow: 0 1px 0 #ffffff;
      user-select: none;
    }

    .menu-bar span::first-letter {
      text-decoration: underline;
    }

    /* Inner Content Area */
    .window-body {
      padding: 16px;
    }

    /* Profile Header Box (Sunken Bevel) */
    .profile-box {
      background-color: #ffffff;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      box-shadow: inset 1px 1px #000000;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border: 1px solid #000000;
      background-color: #c0c0c0;
      object-fit: cover;
      flex-shrink: 0;
    }

    .profile-info h1 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .profile-info p {
      font-size: 13px;
      line-height: 1.35;
      color: #222222;
    }

    /* Fieldset Group for Links */
    fieldset {
      border: 1px solid #808080;
      box-shadow: 1px 1px 0 #ffffff, inset 1px 1px 0 #ffffff;
      padding: 14px 12px 12px;
      margin-bottom: 14px;
    }

    legend {
      padding: 0 6px;
      font-size: 13px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Classic 3D Beveled Buttons */
    .win-btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      background-color: #c0c0c0;
      color: #000000;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset -1px -1px #808080, inset 1px 1px #dfdfdf;
      cursor: pointer;
    }

    .win-btn:hover {
      background-color: #c8c8c8;
      outline: 1px dotted #000000;
      outline-offset: -5px;
    }

    /* Sunken press effect when clicked */
    .win-btn:active {
      border-top: 2px solid #000000;
      border-left: 2px solid #000000;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      box-shadow: inset 1px 1px #808080;
      padding: 10px 11px 8px 13px;
    }

    /* Bottom Status Bar */
    .status-bar {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      font-size: 12px;
    }

    .status-panel {
      flex: 1;
      padding: 3px 6px;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    .status-panel.small {
      flex: 0 0 auto;
    }
  </style>
</head>
<body>

  <div class="window">
    <!-- Title Bar -->
    <div class="title-bar">
      <span>Welcome.exe - User Profile</span>
      <div class="title-bar-controls">
        <div class="title-btn">_</div>
        <div class="title-btn">□</div>
        <div class="title-btn">×</div>
      </div>
    </div>

    <!-- Menu Bar -->
    <div class="menu-bar">
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
      <span>Help</span>
    </div>

    <!-- Main Window Body -->
    <div class="window-body">
      
      <!-- Profile Section -->
      <div class="profile-box">
        <!-- Replace src with your own photo URL -->
        <img class="avatar" src="https://via.placeholder.com/64" alt="Avatar" />
        <div class="profile-info">
          <h1>Your Name</h1>
          <p>Welcome to my homepage! Click any link below to connect or see what I'm working on.</p>
        </div>
      </div>

      <!-- Links Section -->
      <fieldset>
        <legend>My Links</legend>
        <div class="links-list">
          <a class="win-btn" href="https://yourportfolio.com" target="_blank">📁 My Portfolio / Work</a>
          <a class="win-btn" href="https://youtube.com" target="_blank">📺 YouTube Channel</a>
          <a class="win-btn" href="https://instagram.com" target="_blank">📷 Instagram</a>
          <a class="win-btn" href="https://github.com" target="_blank">💻 GitHub</a>
          <a class="win-btn" href="mailto:you@example.com">✉️ Send E-Mail</a>
        </div>
      </fieldset>

      <!-- Bottom Status Bar -->
      <div class="status-bar">
        <div class="status-panel">Ready</div>
        <div class="status-panel small">Online</div>
      </div>

    </div>
  </div>

</body>
</html>
